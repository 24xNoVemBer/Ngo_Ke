<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800">
  <!-- Hallmark · pre-emit critique: P4 H4 E4 S5 R4 V4 · native design concept, not runtime QA -->
  <defs>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pine-deep)" stop-opacity=".64"/><stop offset=".38" stop-color="var(--pine-deep)" stop-opacity=".15"/><stop offset="1" stop-color="var(--pine-deep)" stop-opacity=".93"/></linearGradient>
    <linearGradient id="left-scrim"><stop offset="0" stop-color="var(--pine-deep)" stop-opacity=".70"/><stop offset=".65" stop-color="var(--pine-deep)" stop-opacity=".05"/><stop offset="1" stop-color="var(--pine-deep)" stop-opacity="0"/></linearGradient>
    <clipPath id="logo-clip"><circle cx="44" cy="375" r="20"/></clipPath>
    <filter id="paper-shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="-3" stdDeviation="7" flood-color="var(--pine-deep)" flood-opacity=".12"/></filter>
    <filter id="button-shadow" x="-10%" y="-30%" width="120%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="var(--gold-ink)" flood-opacity=".13"/></filter>
    <g id="mic" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="-4" y="-10" width="8" height="14" rx="4"/><path d="M-8 0v2a8 8 0 0 0 16 0V0M0 10v5M-4 15h8"/></g>
    <g id="pause" fill="currentColor"><rect x="-6" y="-7" width="4" height="14" rx="1"/><rect x="2" y="-7" width="4" height="14" rx="1"/></g>
    <g id="pen" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m-7 4 11-11 4 4L-3 8l-6 1 2-5ZM2-5l4 4"/></g>
  </defs>
  <style>
    :root{--paper:#F7F2E8;--paper-light:#FFFDF7;--ink:#2E3028;--muted:#626559;--pine:#2D5748;--pine-deep:#16382D;--pine-light:#DCE8DF;--gold:#D8B576;--gold-ink:#574022;--line:#DDD6C8;--clay:#9C4F36;--clay-soft:#F0E5D8;--font-ui:'Segoe UI',Arial,sans-serif;--font-display:Georgia,'Times New Roman',serif}
    text{font-family:var(--font-ui);font-size:14px;fill:var(--ink)}.small{font-size:13px}.bold{font-weight:600}.muted{fill:var(--muted)}.light{fill:var(--paper-light)}.pine{fill:var(--pine)}.display{font-family:var(--font-display);font-weight:700}.brand{font-size:17px;letter-spacing:1.7px}.point{font-size:22px}.title{font-size:16px}.gold{fill:var(--gold)}
  </style>
  <g id="listen-base">
    <rect width="360" height="800" fill="var(--paper)"/>
    <image href="../mobile/assets/photos/pexels_demo_01.jpg" x="0" y="0" width="360" height="350" preserveAspectRatio="xMidYMid slice"/>
    <rect width="360" height="350" fill="url(#scrim)"/>
    <rect width="360" height="350" fill="url(#left-scrim)"/>
    <text x="24" y="22" class="small bold light">9:41</text>
    <g fill="var(--paper-light)"><rect x="295" y="12" width="3" height="6" rx="1"/><rect x="300" y="10" width="3" height="8" rx="1"/><rect x="305" y="8" width="3" height="10" rx="1"/></g>
    <rect x="318" y="9" width="22" height="10" rx="3" fill="none" stroke="var(--paper-light)"/><rect x="320" y="11" width="16" height="6" rx="1" fill="var(--paper-light)"/>
    <g aria-label="Về sơ đồ ngõ" data-hit="24,36,48,48"><circle cx="42" cy="60" r="19" fill="var(--pine-deep)" fill-opacity=".65"/><path d="m44 54-6 6 6 6" fill="none" stroke="var(--paper-light)" stroke-width="1.8" stroke-linecap="round"/></g>
    <text x="180" y="66" text-anchor="middle" class="display brand light">NGÕ KỂ</text>
    <g aria-label="Chọn điểm khác" data-hit="288,36,48,48"><circle cx="318" cy="60" r="19" fill="var(--pine-deep)" fill-opacity=".65"/><g fill="var(--paper-light)"><circle cx="312" cy="60" r="1.7"/><circle cx="318" cy="60" r="1.7"/><circle cx="324" cy="60" r="1.7"/></g></g>
    <text x="24" y="120" class="small light">ĐANG XEM · ĐIỂM 01 / 06</text>
    <text x="24" y="151" class="display point light">Cổng ngõ</text>
    <rect x="24" y="169" width="109" height="25" rx="5" fill="var(--paper-light)" fill-opacity=".94"/>
    <text x="78.5" y="186" text-anchor="middle" class="small pine">Truyện hư cấu</text>
    <text x="24" y="308" class="small light">Ảnh: Thuan Pham · Pexels</text>
    <path d="M0 351Q0 330 24 330H336Q360 330 360 351V800H0Z" fill="var(--paper)" filter="url(#paper-shadow)"/>
    <path d="M300 324H324V349L312 343 300 349Z" fill="var(--gold)"/>
    <image href="../mobile/assets/logo_monogram.jpg" x="24" y="355" width="40" height="40" clip-path="url(#logo-clip)"/>
    <text x="76" y="370" class="bold title">Người kể ngõ phố</text>
    <text x="76" y="390" class="small muted">Giọng nữ miền Bắc</text>
    <g aria-label="Tạm dừng lời kể" data-hit="24,409,252,70"><rect x="24" y="413" width="312" height="66" rx="16" fill="var(--pine-deep)"/><circle cx="57" cy="446" r="21" fill="var(--paper-light)"/><use href="#pause" x="57" y="446" color="var(--pine)"/><text x="91" y="439" class="bold light">Đang kể: Cổng ngõ</text><text x="91" y="459" class="small" fill="var(--pine-light)" style="fill:var(--pine-light)">Nhấn để tạm dừng</text></g>
    <g aria-label="Dừng phát" data-hit="284,422,48,48"><rect x="308" y="439" width="10" height="10" rx="2" fill="var(--paper-light)" fill-opacity=".8"/></g>
    <rect x="24" y="494" width="312" height="3" rx="1.5" fill="var(--line)"/><rect x="24" y="494" width="101" height="3" rx="1.5" fill="var(--clay)"/><circle cx="125" cy="495.5" r="3" fill="var(--clay)"/>
    <g aria-label="Xem lời kể bằng chữ" data-hit="24,502,312,48"><text x="24" y="529" class="pine">Xem lời kể bằng chữ</text><path d="m321 521 5 5 5-5" fill="none" stroke="var(--pine)" stroke-width="1.5" stroke-linecap="round"/></g>
    <path d="M24 550H336" stroke="var(--line)"/>
    <text x="24" y="573" class="small muted">Câu hỏi tiếp theo</text>
    <g aria-label="Hỏi Mình có thể hỏi gì tiếp" data-hit="24,584,130,48"><rect x="24" y="586" width="126" height="42" rx="12" fill="var(--paper-light)" stroke="var(--line)"/><path d="M40 600h12v8h-5l-4 3v-3h-3Z" fill="none" stroke="var(--pine)" stroke-width="1.2"/><text x="62" y="613">Hỏi gì tiếp?</text></g>
    <g aria-label="Chọn trải nghiệm" data-hit="172,584,164,48"><text x="180" y="613" class="pine bold">Chọn trải nghiệm</text><path d="M314 608h13m-5-4 5 4-5 4" fill="none" stroke="var(--pine)" stroke-width="1.3"/></g>
    <path d="M24 642H336" stroke="var(--line)"/>
    <g aria-label="Xem Hiên đồng hồ" data-hit="24,646,312,48"><circle cx="43" cy="666" r="17" fill="var(--clay-soft)"/><text x="43" y="671" text-anchor="middle" class="small bold" style="fill:var(--clay)">02</text><text x="76" y="657" class="small muted">Chương kế tiếp</text><text x="76" y="677" class="bold">Hiên đồng hồ</text><path d="M315 665h13m-5-4 5 4-5 4" fill="none" stroke="var(--muted)" stroke-width="1.3"/></g>
    <g aria-label="Nhấn để hỏi tiếp bằng giọng nói" data-hit="24,710,260,56"><rect x="24" y="710" width="260" height="56" rx="16" fill="var(--gold)" filter="url(#button-shadow)"/><use href="#mic" x="52" y="736" color="var(--gold-ink)"/><text x="79" y="744" class="bold" style="fill:var(--gold-ink)">Nhấn để hỏi tiếp</text></g>
    <g aria-label="Gõ câu hỏi bằng chữ" data-hit="296,710,48,56"><use href="#pen" x="320" y="730" color="var(--pine)"/><text x="320" y="756" text-anchor="middle" class="small pine">Gõ chữ</text></g>
    <rect x="128" y="786" width="104" height="4" rx="2" fill="var(--pine-deep)"/>
  </g>
</svg>
